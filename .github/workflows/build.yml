name: Build Screendrop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-build:
    if: github.repository == 'helmisatria/Screendrop'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Install Metal compiler
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Build Release for Apple silicon and Intel
        run: |
          xcodebuild build \
            -project Screendrop.xcodeproj \
            -scheme Screendrop \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/Screendrop" \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO
      - name: Package unsigned build for inspection
        run: |
          app="$RUNNER_TEMP/Screendrop/Build/Products/Release/Screendrop.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = com.fayazahmed.Screendrop
          test ! -e "$app/Contents/MacOS/Screendrop.debug.dylib"
          lipo "$app/Contents/MacOS/Screendrop" -verify_arch arm64 x86_64
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/Screendrop-unsigned.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Screendrop-Release-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/Screendrop-unsigned.zip
          if-no-files-found: error
          retention-days: 14
