name: Publish Screendrop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.34.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-screendrop
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'helmisatria/Screendrop' && (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      DEVELOPER_ID_APPLICATION: ${{ vars.DEVELOPER_ID_APPLICATION }}
      APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Validate tag and published versions
        run: |
          git fetch origin main
          git rev-parse --verify "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          python3 scripts/validate-release.py "$RELEASE_TAG"
          if gh api "repos/helmisatria/Screendrop/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/tag-release.json" 2> "$RUNNER_TEMP/tag-release.error"; then
            python3 - "$RUNNER_TEMP/tag-release.json" <<'PY'
          import json, sys
          if not json.load(open(sys.argv[1]))['draft']:
              raise SystemExit('This version is already published. Increment version and build instead of replacing it.')
          PY
          elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/tag-release.error"; then
            cat "$RUNNER_TEMP/tag-release.error" >&2
            exit 1
          fi
          if gh api repos/helmisatria/Screendrop/releases/latest > "$RUNNER_TEMP/latest-release.json" 2> "$RUNNER_TEMP/latest-release.error"; then
            previous_tag="$(python3 - "$RUNNER_TEMP/latest-release.json" <<'PY'
          import json, sys
          release = json.load(open(sys.argv[1]))
          if any(asset['name'] == 'appcast.xml' for asset in release['assets']):
              print(release['tag_name'])
          PY
            )"
            if [[ -n "$previous_tag" ]]; then
              gh release download "$previous_tag" --repo helmisatria/Screendrop --pattern appcast.xml --dir "$RUNNER_TEMP/previous-release"
              python3 scripts/validate-release.py "$RELEASE_TAG" --previous-appcast "$RUNNER_TEMP/previous-release/appcast.xml"
            fi
          elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/latest-release.error"; then
            cat "$RUNNER_TEMP/latest-release.error" >&2
            exit 1
          fi
      - name: Import release credentials into temporary keychain
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          for variable in APPLE_TEAM_ID DEVELOPER_ID_APPLICATION APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID CERTIFICATE_BASE64 CERTIFICATE_PASSWORD API_KEY_BASE64 SPARKLE_PRIVATE_KEY; do
            if [[ -z "${!variable}" ]]; then
              echo "Missing release credential: $variable" >&2
              exit 1
            fi
          done
          credentials="$RUNNER_TEMP/screendrop-credentials"
          mkdir -p "$credentials"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$credentials/certificate.p12"
          printf '%s' "$API_KEY_BASE64" | base64 --decode > "$credentials/AuthKey.p8"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$credentials/sparkle-key"
          keychain="$credentials/release.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$credentials/certificate.p12" -P "$CERTIFICATE_PASSWORD" -k "$keychain" -T /usr/bin/codesign -T /usr/bin/security > /dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          echo "APP_STORE_CONNECT_KEY_FILE=$credentials/AuthKey.p8" >> "$GITHUB_ENV"
          echo "SPARKLE_PRIVATE_KEY_FILE=$credentials/sparkle-key" >> "$GITHUB_ENV"
      - name: Install Metal compiler
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Sign, notarize and package release
        run: bash scripts/package-release.sh "$RELEASE_TAG" "$RUNNER_TEMP/Screendrop-release"
      - name: Publish both assets together
        run: |
          if ! gh release view "$RELEASE_TAG" --repo helmisatria/Screendrop > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo helmisatria/Screendrop --verify-tag --draft --title "Screendrop ${RELEASE_TAG#v}" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" --repo helmisatria/Screendrop --clobber \
            "$RUNNER_TEMP/Screendrop-release/updates/Screendrop-${RELEASE_TAG#v}.zip" \
            "$RUNNER_TEMP/Screendrop-release/updates/appcast.xml"
          gh release edit "$RELEASE_TAG" --repo helmisatria/Screendrop --draft=false --latest
      - name: Remove temporary signing credentials
        if: always()
        run: |
          credentials="$RUNNER_TEMP/screendrop-credentials"
          if [[ -e "$credentials/release.keychain-db" ]]; then
            security delete-keychain "$credentials/release.keychain-db"
          fi
          rm -rf "$credentials"
